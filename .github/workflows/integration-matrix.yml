name: Integration matrix

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        wordpress: ['7.0-branch', '7.1-branch', 'master']
    env:
      WP_ENV_CORE: WordPress/WordPress#${{ matrix.wordpress }}
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --ignore-scripts

      - name: Run integration tests
        run: |
          npx wp-env start
          npm run test:integration

  result:
    name: Result
    runs-on: ubuntu-latest
    needs: integration
    if: ${{ !cancelled() }}
    steps:
      - name: Verify integration matrix
        run: test '${{ needs.integration.result }}' = 'success'
