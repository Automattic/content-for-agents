name: Release

on:
  push:
    branches:
      - trunk

permissions:
  contents: write

jobs:
  check-and-release:
    name: Check and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version_check
        run: |
          OLD_VERSION=$(git show HEAD^:content-for-agents.php 2>/dev/null | sed -n 's/.*Version: *//p' | head -n1 | tr -d '[:space:]')
          NEW_VERSION=$(git show HEAD:content-for-agents.php | sed -n 's/.*Version: *//p' | head -n1 | tr -d '[:space:]')
          if [ -z "$OLD_VERSION" ] || [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "No version change detected"
            exit 0
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version changed from $OLD_VERSION to $NEW_VERSION"

      - name: Set up Node.js
        if: steps.version_check.outputs.new_version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build plugin ZIP
        if: steps.version_check.outputs.new_version
        run: npm ci --ignore-scripts && npm run plugin-zip

      - name: Create release
        if: steps.version_check.outputs.new_version
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version_check.outputs.new_version }}
          files: content-for-agents.zip
          generate_release_notes: true
