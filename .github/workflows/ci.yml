name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP matrix
    uses: ./.github/workflows/php-matrix.yml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check types
        run: npm run typecheck

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Check formatting
        run: npm run format:check

      - name: Build production assets
        run: |
          npm run build
          test -f build/settings/index.js
          test -f build/settings/index.asset.php
          test -f build/settings/style-index.css
          test -f build/settings/style-index-rtl.css

      - name: Run frontend tests
        run: npm run test:frontend

  integration:
    name: Integration matrix
    uses: ./.github/workflows/integration-matrix.yml

  php-required:
    name: PHP
    runs-on: ubuntu-latest
    needs: php
    if: ${{ !cancelled() }}
    steps:
      - name: Verify PHP matrix
        run: test '${{ needs.php.result }}' = 'success'

  integration-required:
    name: Integration
    runs-on: ubuntu-latest
    needs: integration
    if: ${{ !cancelled() }}
    steps:
      - name: Verify integration matrix
        run: test '${{ needs.integration.result }}' = 'success'
