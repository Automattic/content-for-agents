name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check WordPress VIP coding standards
        run: composer phpcs

      - name: Check PHP syntax
        run: find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        run: composer test:unit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check types
        run: npm run typecheck

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Check formatting
        run: npm run format:check

      - name: Build production assets
        run: |
          npm run build
          test -f build/settings/index.js
          test -f build/settings/index.asset.php
          test -f build/settings/style-index.css
          test -f build/settings/style-index-rtl.css

      - name: Run frontend tests
        run: npm run test:frontend

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        wordpress: ['7.0-branch', '7.1-branch', 'master']
    env:
      WP_ENV_CORE: WordPress/WordPress#${{ matrix.wordpress }}
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --ignore-scripts

      - name: Run integration tests
        run: |
          npx wp-env start
          npm run test:integration
