name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP
    uses: ./.github/workflows/php-matrix.yml

  integration:
    name: Integration
    uses: ./.github/workflows/integration-matrix.yml
